<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-rel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3fb"/>
      <stop offset="60%" stop-color="#efeaf8"/>
      <stop offset="100%" stop-color="#ddd5ea"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-rel)"/>
  <!-- Dois círculos entrelaçados — símbolo do encontro -->
  <g transform="translate(400, 300)">
    <circle cx="-40" cy="0" r="100" stroke="#8b6db5" stroke-width="2.5" fill="none" opacity="0.5"/>
    <circle cx="40" cy="0" r="100" stroke="#d4a574" stroke-width="2.5" fill="none" opacity="0.5"/>
    <circle cx="-40" cy="0" r="100" stroke="#8b6db5" stroke-width="1" fill="none" opacity="0.25"/>
    <circle cx="40" cy="0" r="100" stroke="#d4a574" stroke-width="1" fill="none" opacity="0.25"/>
  </g>
</svg>
