<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-esp2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f5fb"/>
      <stop offset="60%" stop-color="#edeef8"/>
      <stop offset="100%" stop-color="#d8dbeb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-esp2)"/>
  <!-- Círculos concêntricos — símbolo de meditação e profundidade psicoemocional -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="150" stroke="#3a4a8c" stroke-width="1.5" fill="none" opacity="0.3"/>
    <circle cx="0" cy="0" r="110" stroke="#3a4a8c" stroke-width="2" fill="none" opacity="0.45"/>
    <circle cx="0" cy="0" r="70" stroke="#3a4a8c" stroke-width="2" fill="none" opacity="0.55"/>
    <circle cx="0" cy="0" r="30" stroke="#3a4a8c" stroke-width="2.5" fill="none" opacity="0.7"/>
    <circle cx="0" cy="0" r="6" fill="#3a4a8c" opacity="0.8"/>
    <!-- Linhas radiais sutis -->
    <line x1="-180" y1="0" x2="-160" y2="0" stroke="#3a4a8c" stroke-width="1.5" opacity="0.4"/>
    <line x1="160" y1="0" x2="180" y2="0" stroke="#3a4a8c" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="-180" x2="0" y2="-160" stroke="#3a4a8c" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="160" x2="0" y2="180" stroke="#3a4a8c" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>
