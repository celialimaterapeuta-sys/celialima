    <circle cx="1340" cy="280" r="1.0" opacity="0.6"/>
    <circle cx="1560" cy="60" r="1.1" opacity="0.65"/>
    <circle cx="1740" cy="280" r="1.0" opacity="0.6"/>
  </g>

  <!-- Nível 4: estrelas minúsculas (poeira estelar densa) -->
