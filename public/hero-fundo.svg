    <circle cx="1380" cy="60" r="1.0" opacity="0.6"/>
    <circle cx="1460" cy="200" r="0.9" opacity="0.55"/>
    <circle cx="1620" cy="240" r="1.0" opacity="0.6"/>
    <circle cx="1780" cy="160" r="0.9" opacity="0.55"/>
    <circle cx="1860" cy="320" r="1.0" opacity="0.6"/>
    <circle cx="100" cy="160" r="1.1" opacity="0.65"/>
    <circle cx="500" cy="200" r="1.0" opacity="0.6"/>
    <circle cx="700" cy="200" r="1.1" opacity="0.65"/>
    <circle cx="900" cy="60" r="1.0" opacity="0.6"/>
    <circle cx="1300" cy="200" r="1.0" opacity="0.6"/>
    <circle cx="1500" cy="180" r="1.1" opacity="0.65"/>
    <circle cx="1700" cy="60" r="1.0" opacity="0.6"/>
    <circle cx="1800" cy="220" r="1.1" opacity="0.65"/>
    <circle cx="200" cy="500" r="1.0" opacity="0.6"/>
