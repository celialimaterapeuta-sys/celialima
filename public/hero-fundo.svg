    <circle cx="1760" cy="180" r="0.5" opacity="0.4"/>
    <circle cx="1840" cy="40" r="0.6" opacity="0.45"/>
    <circle cx="80" cy="280" r="0.5" opacity="0.4"/>
    <circle cx="160" cy="440" r="0.6" opacity="0.45"/>
    <circle cx="240" cy="380" r="0.5" opacity="0.4"/>
    <circle cx="340" cy="500" r="0.6" opacity="0.45"/>
    <circle cx="420" cy="380" r="0.5" opacity="0.4"/>
    <circle cx="500" cy="460" r="0.6" opacity="0.45"/>
    <circle cx="580" cy="540" r="0.5" opacity="0.4"/>
    <circle cx="660" cy="460" r="0.6" opacity="0.45"/>
    <circle cx="740" cy="500" r="0.5" opacity="0.4"/>
    <circle cx="820" cy="380" r="0.6" opacity="0.45"/>
    <circle cx="900" cy="460" r="0.5" opacity="0.4"/>
    <circle cx="980" cy="380" r="0.6" opacity="0.45"/>
    <circle cx="1060" cy="460" r="0.5" opacity="0.4"/>
