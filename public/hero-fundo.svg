    <circle cx="50" cy="40" r="0.5" opacity="0.4"/>
    <circle cx="90" cy="80" r="0.6" opacity="0.45"/>
    <circle cx="160" cy="180" r="0.5" opacity="0.4"/>
    <circle cx="240" cy="100" r="0.6" opacity="0.45"/>
    <circle cx="300" cy="180" r="0.5" opacity="0.4"/>
