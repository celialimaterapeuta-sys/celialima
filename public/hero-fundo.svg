  <!-- ========================================== -->
  <!-- CONSTELAÇÕES — linhas finas conectando     -->
  <!-- ========================================== -->

  <!-- Constelação 1: "Cálice" (canto sup. esquerdo) -->
  <g stroke="#e6c285" stroke-width="0.5" opacity="0.45" fill="none">
    <line x1="140" y1="120" x2="220" y2="100"/>
    <line x1="220" y1="100" x2="300" y2="180"/>
    <line x1="300" y1="180" x2="380" y2="80"/>
    <line x1="380" y1="80" x2="460" y2="100"/>
  </g>

  <!-- Constelação 2: "Caminho" (centro superior) -->
  <g stroke="#e6c285" stroke-width="0.5" opacity="0.4" fill="none">
