<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Céu noturno: lavanda clara -> lilás médio -> roxo profundo -->
    <linearGradient id="hero-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1a2e"/>
      <stop offset="35%" stop-color="#2d2640"/>
      <stop offset="65%" stop-color="#4a3d6b"/>
      <stop offset="100%" stop-color="#7b6ba8"/>
    </linearGradient>

    <!-- Halo lunar suave -->
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f3fb" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#b9a0e0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#b9a0e0" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow da galáxia espiral -->
    <radialGradient id="galaxy-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6c285" stop-opacity="0.40"/>
      <stop offset="35%" stop-color="#d4a574" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#8b6db5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8b6db5" stop-opacity="0"/>
    </radialGradient>

    <!-- Camadas de colinas (silhuetas noturnas) -->
    <linearGradient id="hill-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3354" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1f1a2e" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="hill-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3a3354" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="hill-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1a2e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0e0a1c" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Glow para estrelas brilhantes -->
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e6" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e6c285" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e6c285" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Céu -->
  <rect width="1920" height="1080" fill="url(#hero-sky)"/>

  <!-- Galáxia espiral sutil (canto esquerdo inferior) -->
  <g transform="translate(280, 480) rotate(-20)" opacity="0.65">
    <ellipse cx="0" cy="0" rx="320" ry="120" fill="url(#galaxy-glow)"/>
    <ellipse cx="0" cy="0" rx="220" ry="80" fill="url(#galaxy-glow)" transform="rotate(35)"/>
    <ellipse cx="0" cy="0" rx="120" ry="40" fill="url(#galaxy-glow)" transform="rotate(70)"/>
    <!-- Núcleo mais brilhante da galáxia -->
    <circle cx="0" cy="0" r="6" fill="#fff8e6" opacity="0.7"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff" opacity="0.9"/>
    <!-- Pontos espalhados pelo disco galáctico -->
    <circle cx="-180" cy="-30" r="0.8" fill="#fff8e6" opacity="0.6"/>
    <circle cx="-140" cy="20" r="0.7" fill="#fff8e6" opacity="0.5"/>
    <circle cx="-90" cy="-15" r="0.9" fill="#fff8e6" opacity="0.7"/>
    <circle cx="-50" cy="25" r="0.7" fill="#fff8e6" opacity="0.6"/>
    <circle cx="60" cy="-20" r="0.8" fill="#fff8e6" opacity="0.6"/>
    <circle cx="100" cy="15" r="0.9" fill="#fff8e6" opacity="0.7"/>
    <circle cx="150" cy="-25" r="0.7" fill="#fff8e6" opacity="0.5"/>
    <circle cx="200" cy="20" r="0.8" fill="#fff8e6" opacity="0.6"/>
    <circle cx="240" cy="-10" r="0.7" fill="#fff8e6" opacity="0.5"/>
    <!-- Outro braço (rotacionado) -->
    <circle cx="-110" cy="60" r="0.7" fill="#fff8e6" opacity="0.55"/>
    <circle cx="-60" cy="90" r="0.8" fill="#fff8e6" opacity="0.6"/>
    <circle cx="40" cy="80" r="0.7" fill="#fff8e6" opacity="0.5"/>
    <circle cx="90" cy="110" r="0.9" fill="#fff8e6" opacity="0.65"/>
    <circle cx="160" cy="90" r="0.7" fill="#fff8e6" opacity="0.55"/>
  </g>

  <!-- ========================================== -->
  <!-- ESTRELAS — múltiplos tamanhos (4 níveis)   -->
  <!-- ========================================== -->

  <!-- Estrelas extras na região onde estava a lua (canto sup. direito) -->
  <g fill="#fff8e6">
    <circle cx="1380" cy="180" r="2.2" opacity="0.85"/>
    <circle cx="1450" cy="240" r="1.6" opacity="0.7"/>
    <circle cx="1520" cy="200" r="1.8" opacity="0.8"/>
    <circle cx="1580" cy="280" r="1.4" opacity="0.65"/>
    <circle cx="1620" cy="220" r="1.7" opacity="0.75"/>
    <circle cx="1680" cy="280" r="1.5" opacity="0.7"/>
    <circle cx="1430" cy="320" r="1.5" opacity="0.7"/>
    <circle cx="1560" cy="360" r="1.3" opacity="0.6"/>
    <!-- Pequena constelação adicional na área -->
    <circle cx="1400" cy="120" r="1.6" opacity="0.75"/>
    <circle cx="1480" cy="80" r="1.4" opacity="0.65"/>
    <circle cx="1560" cy="160" r="1.5" opacity="0.7"/>
  </g>
  <g stroke="#e6c285" stroke-width="0.5" opacity="0.4" fill="none">
    <line x1="1380" y1="180" x2="1480" y2="80"/>
    <line x1="1480" y1="80" x2="1560" y2="160"/>
    <line x1="1560" y1="160" x2="1620" y2="220"/>
  </g>

  <!-- Nível 1: estrelas grandes com brilho (3 estrelas-destaque) -->
  <g>
    <circle cx="620" cy="180" r="20" fill="url(#star-glow)"/>
    <circle cx="620" cy="180" r="2.6" fill="#fff8e6" opacity="0.95"/>
    <line x1="620" y1="172" x2="620" y2="188" stroke="#fff8e6" stroke-width="0.7" opacity="0.6"/>
    <line x1="612" y1="180" x2="628" y2="180" stroke="#fff8e6" stroke-width="0.7" opacity="0.6"/>

    <circle cx="1080" cy="200" r="16" fill="url(#star-glow)"/>
    <circle cx="1080" cy="200" r="2.2" fill="#fff8e6" opacity="0.95"/>
    <line x1="1080" y1="192" x2="1080" y2="208" stroke="#fff8e6" stroke-width="0.7" opacity="0.6"/>
    <line x1="1072" y1="200" x2="1088" y2="200" stroke="#fff8e6" stroke-width="0.7" opacity="0.6"/>

    <circle cx="1700" cy="220" r="18" fill="url(#star-glow)"/>
    <circle cx="1700" cy="220" r="2.5" fill="#fff8e6" opacity="0.95"/>
    <line x1="1700" y1="212" x2="1700" y2="228" stroke="#fff8e6" stroke-width="0.7" opacity="0.6"/>
    <line x1="1692" y1="220" x2="1708" y2="220" stroke="#fff8e6" stroke-width="0.7" opacity="0.6"/>
  </g>

